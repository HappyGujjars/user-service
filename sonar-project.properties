sonar.projectKey=critical-backend
sonar.projectName=critical-backend
sonar.projectVersion=1.0

# Source and Test directories
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.spec.ts,test/**/*.ts

# Exclusions
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,security-report-generator/**
sonar.sourceEncoding=UTF-8
